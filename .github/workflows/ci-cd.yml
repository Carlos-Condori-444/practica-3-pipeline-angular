name: CI-CD Angular

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  ci:
    name: Pruebas y compilacion
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Instalar dependencias
        run: npm install

      - name: Ejecutar pruebas
        run: npm run test -- --watch=false

      - name: Generar build
        run: npm run build

  deploy:
    name: Despliegue a produccion
    needs: ci
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    steps:
      - name: Descargar codigo
        uses: actions/checkout@v4

      - name: Configurar Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Instalar dependencias
        run: npm install

      - name: Generar build
        run: npm run build

      - name: Publicar carpeta dist por FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          local-dir: ./dist/practica-angular/browser/
          server-dir: /
